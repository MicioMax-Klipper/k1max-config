[mcu leveling_mcu]
serial: /dev/ttyS9
baud: 230400
restart_method: command

[load_cell prtouch0]  # likely front-left / SUD-OVEST
sensor_type: hx711
sclk_pin: leveling_mcu:PA7
dout_pin: leveling_mcu:PA4

counts_per_gram: 106.5
reference_tare_counts: -192989
sensor_orientation: inverted

[load_cell prtouch1]  # likely front-right / SUD-EST
sensor_type: hx711
sclk_pin: leveling_mcu:PA6
dout_pin: leveling_mcu:PA3

counts_per_gram: 108.85
reference_tare_counts: -88777
sensor_orientation: inverted

#[load_cell prtouch2]  # likely rear-left / NORD-OVEST
#sensor_type: hx711
#sclk_pin: leveling_mcu:PA2
#dout_pin: leveling_mcu:PA0

[load_cell prtouch3]  # likely rear-right / NORD-EST
sensor_type: hx711
sclk_pin: leveling_mcu:PA5
dout_pin: leveling_mcu:PA1

counts_per_gram: 81.08
reference_tare_counts: -144153
sensor_orientation: inverted

[load_cell_probe lc]
sensor_type: hx711
sclk_pin: leveling_mcu:PA2
dout_pin: leveling_mcu:PA0

counts_per_gram: 91.2
reference_tare_counts: 337000
sensor_orientation: inverted

trigger_force: 200
force_safety_limit: 500
tare_time: 1.0

cell_mask: 0

x_offset: 0
y_offset: 0
z_offset: 0

[gcode_macro LOAD_CELL_FORCE]
gcode:
    LOAD_CELL_READ LOAD_CELL=lc
    LC_RAW


[gcode_macro LC_TOUCH_FAST_FINE]
variable_z_bias: 0.11
gcode:
    {% set x = params.X|default(153)|float %}
    {% set y = params.Y|default(153)|float %}
    {% set z_start = params.Z_START|default(20)|float %}
    {% set coarse_speed = params.COARSE_SPEED|default(5.0)|float %}
    {% set coarse_force = params.COARSE_FORCE|default(90)|int %}
    {% set z_bias = params.Z_BIAS|default(printer["gcode_macro LC_TOUCH_FAST_FINE"].z_bias)|float %}

    G90
    G1 X{x} Y{y} Z{z_start} F6000

    LOAD_CELL_TARE LOAD_CELL=lc
    G4 P1000

    LC_PROBE PROBE_SPEED={coarse_speed} TRIGGER_FORCE={coarse_force}

    G91
    G1 Z1.00 F600
    G90
    G4 P500

    LC_FINE_PROBE STEP=0.02 DF_THRESHOLD=8 MAX_DIST=1.50 SPEED=0.2 SAMPLES=5 DWELL=0.03 HITS=1 Z_BIAS={z_bias}


[gcode_macro LC_TOUCH_SAFE_TEST]
gcode:
    G90
    G1 X153 Y153 Z2 F6000

    LOAD_CELL_TARE LOAD_CELL=lc
    G4 P1000

    LC_PROBE PROBE_SPEED=0.5 TRIGGER_FORCE=90

    M114
    LOAD_CELL_READ LOAD_CELL=lc
    LC_RAW

