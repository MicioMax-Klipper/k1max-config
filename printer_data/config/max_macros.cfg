[gcode_macro APPLY_PLATE_Z_OFFSET]
description: Apply PETG-only additive Z offset based on Orca plate type
gcode:
    {% set plate = params.PLATE|default("")|lower %}
    {% set material = params.MATERIAL|default("")|lower %}

    {% set z = 0.0 %}
    {% set applied = false %}
    {% set reason = "missing/unknown plate or non-PETG material" %}

    {% if "petg" in material %}
        {% if "ingegneristico" in plate or "engineering" in plate %}
            {% set z = -0.05 %}
            {% set applied = true %}
            {% set reason = "PETG engineering/saponetta plate" %}
        {% elif "pei ruvido" in plate or "textured pei" in plate %}
            {% set z = 0.05 %}
            {% set applied = true %}
            {% set reason = "PETG textured/standard plate" %}
        {% elif "alta temperatura" in plate or "high temp" in plate %}
            {% set z = 0.00 %}
            {% set applied = true %}
            {% set reason = "PETG smooth/high-temp plate" %}
        {% endif %}
    {% endif %}

    RESPOND TYPE=command MSG="Plate Z offset: applied={applied} z_adjust={z} material='{material}' plate='{plate}' reason='{reason}'"
    SET_GCODE_OFFSET Z_ADJUST={z} MOVE=0
