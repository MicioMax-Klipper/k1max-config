# Massimo-specific homing extensions.
#
# Included after homing.cfg.
#
# Do NOT define G28 here:
# Klipper does not allow renaming [homing_override] with gcode_macro rename_existing.

[gcode_macro _MAX_HOMING_STATE]
variable_prtouch_active: False
gcode:

[gcode_macro MAX_HOMING_RESET]
description: Clear local homing recursion guards
gcode:
  SET_GCODE_VARIABLE MACRO=_MAX_HOMING_STATE VARIABLE=prtouch_active VALUE=False
  RESPOND MSG="MAX_HOMING_RESET: prtouch_active=False"

[gcode_macro MAX_PRTOUCH_HOME_Z]
description: Home Z using Creality PRTouch without falling back to Cartographer
gcode:
  {% set active = printer["gcode_macro _MAX_HOMING_STATE"].prtouch_active|int %}
  {% set homed = printer.toolhead.homed_axes %}

  {% if active %}
    { action_raise_error("MAX_PRTOUCH_HOME_Z: already active, refusing recursive call") }
  {% endif %}

  {% if "x" not in homed or "y" not in homed %}
    { action_raise_error("MAX_PRTOUCH_HOME_Z: XY not homed. Run G28 X Y first, or plain G28.") }
  {% endif %}

  G90

  SET_GCODE_VARIABLE MACRO=_MAX_HOMING_STATE VARIABLE=prtouch_active VALUE=True

  # Creality PRTouch calls ck_g28ed(), which calls G28 if any axis is unhomed.
  # We intentionally mark Z as temporarily homed before calling PRTouch, so
  # ck_g28ed() does not fall back to the Cartographer/Pellcorp Z path.
  SET_KINEMATIC_POSITION Z=0

  # Clearance before the PRTouch routine moves around.
  G91
  G1 Z5 F600
  G90

  PRTOUCH_HOME_Z_COARSE

  SET_GCODE_VARIABLE MACRO=_MAX_HOMING_STATE VARIABLE=prtouch_active VALUE=False
