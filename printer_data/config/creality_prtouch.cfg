# Creality PRTouch v2 experimental config for K1 Max
#
# Experimental branch goal:
# - Cartographer remains the global probe for mesh/mapping.
# - Creality PRTouch v2 is registered as named probe "prtouch".
# - MDF load_cell_probe is disabled because it uses the same HX711 pins.
# - First phase: diagnostics only; do not integrate into START_PRINT yet.

[prtouch_v2 prtouch]
pr_version: 2
step_base: 2
z_offset: 0

# Creality thermal/mechanical compensation values.
# Do not use these for automatic Z offset until PRTouch is validated.
noz_ex_com: 0.09
tilt_corr_dis: 0.05

tri_min_hold: 6000,10000
tri_max_hold: 13000,60000

pres_cnt: 4
pres0_clk_pins: leveling_mcu:PA7
pres0_sdo_pins: leveling_mcu:PA4
pres1_clk_pins: leveling_mcu:PA6
pres1_sdo_pins: leveling_mcu:PA3
pres2_clk_pins: leveling_mcu:PA2
pres2_sdo_pins: leveling_mcu:PA0
pres3_clk_pins: leveling_mcu:PA5
pres3_sdo_pins: leveling_mcu:PA1

show_msg: False
step_swap_pin: PC10
pres_swap_pin: leveling_mcu:PB1

g28_wait_cool_down: true
pa_clr_down_mm: -0.15

clr_noz_start_x: 130
clr_noz_start_y: 303
clr_noz_len_x: 40
clr_noz_len_y: 2

speeds: 2.5,1.0
tri_hftr_cut: 2,1
tri_lftr_k1: 0.50,0.15

# Creality per-point hold thresholds.
tri_min_hold_1:6000,10000
