
# BTT Smart Filament Sensor - restored after reset

[filament_switch_sensor filament_sensor]
switch_pin: ^PC15
pause_on_runout: true
runout_gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
  M117 Filament runout detected! Unloading...
  G91
  G0 E-30 F600
  G90
  {% endif %}

[filament_motion_sensor encoder_sensor]
switch_pin: ^!PA7
detection_length: 7
extruder: extruder
pause_on_runout: true
runout_gcode:
  M117 Filament motion error detected! Pausing...
  RESPOND TYPE=error MSG="Filament jam / motion error detected"

[gcode_macro TEST_FILAMENT_SENSOR]
gcode:
  {% set s = printer['filament_switch_sensor filament_sensor'].filament_detected %}
  RESPOND TYPE=command MSG="filament_sensor detected = {s}"

[gcode_macro TEST_ENCODER_SENSOR]
gcode:
  RESPOND TYPE=command MSG="encoder_sensor loaded. To test it, extrude filament and block/stop filament movement."

[gcode_macro TEST_FILAMENT_ALL]
gcode:
  TEST_FILAMENT_SENSOR
  TEST_ENCODER_SENSOR

[gcode_macro _NOZZLE_WIPE_SILICONE]
description: Wipe nozzle on rear silicone wiper, with safe deep neck cleaning
gcode:
    SAVE_GCODE_STATE NAME=nozzle_wipe_state

    G90

    ; safe lift
    G1 Z15 F3000

    ; normal wipe
    G1 X115 Y303 F12000
    G1 Z4.10 F600

    G1 X180 Y303 F3000
    G1 X115 Y304 F3000
    G1 X180 Y305 F3000
    G1 X115 Y304 F3000
    G1 X180 Y303 F3000
    G1 X115 Y305 F3000

    G1 Z4.30 F600
    G1 X180 Y304 F3500
    G1 X115 Y303 F3500
    G1 X180 Y305 F3500
    G1 X115 Y304 F3500

    ; deep neck cleaning - safe bounded zone:
    ; X 132.0..137.8, Y 305.0..306.0
    G1 Z15 F3000
    G1 X132.0 Y306.0 F6000
    G1 Z1.00 F600

    G1 X137.8 Y306.0 F1500
    G1 X132.0 Y306.0 F1500
    G1 X132.0 Y305.5 F1500
    G1 X137.8 Y305.5 F1500
    G1 X137.8 Y305.0 F1500
    G1 X132.0 Y305.0 F1500

    ; diagonals within safe zone
    G1 X137.8 Y306.0 F1500
    G1 X132.0 Y305.0 F1500
    G1 X137.8 Y305.0 F1500
    G1 X132.0 Y306.0 F1500

    ; leave danger zone raised
    G1 Z15 F3000
    G1 X115 Y303 F6000

    RESTORE_GCODE_STATE NAME=nozzle_wipe_state MOVE=0
