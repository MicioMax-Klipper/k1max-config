[gcode_macro _CARTOGRAPHER_VARIABLES]
# you can set this to False to not do touch
variable_touch_mode: True
# whether we need to verify K1 specific cartographer firmware is being used
# this will be set to False by the RPI installer
variable_verify_firmware: True
gcode:

[mcu cartographer]
is_non_critical: true
no_reconnect: true # reconnecting cartographer causes klipper to crash
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_67003C00125030514B343620-if00
restart_method: command

[cartographer]
mcu: cartographer
x_offset: -16.0
y_offset: 0.0
verbose: yes

[cartographer scan]
mesh_runs: 2

# if you want to only do scan, disable this section
[cartographer touch]
max_samples: 20

[temperature_sensor cartographer_mcu]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 0
max_temp: 105

[bed_mesh]
horizontal_move_z: 3
speed: 200
mesh_min: 10,10
mesh_max: 287,270
probe_count: 21,21
algorithm: bicubic
bicubic_tension: 0.1
mesh_pps: 0,0
adaptive_margin: 5.0
zero_reference_position: 153,153

[screws_tilt_adjust]
screw1: 35,23
screw1_name: front left screw
screw2: 294,23
screw2_name: front right screw
screw3: 264,272
screw3_name: rear right screw
screw4: 64,272
screw4_name: rear left screw
speed: 50
horizontal_move_z: 5
screw_thread: CW-M4

# this excessive config (the 999) is intentional, we pass `USE_TOUCH_BOUNDARIES=1` to
# do axis twist compensation
[axis_twist_compensation]
speed: 50
horizontal_move_z: 5
calibrate_start_x: 999
calibrate_end_x: 999
calibrate_y: 999
