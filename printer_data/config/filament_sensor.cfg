# BTT Smart Filament Sensor - split from user_override.cfg

# BTT Smart Filament Sensor - restored after reset

[filament_switch_sensor filament_sensor]
switch_pin: ^PC15
pause_on_runout: true
runout_gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
  M117 Filament runout detected! Unloading...
  G91
  G0 E-30 F600
  G90
  {% endif %}

[filament_motion_sensor encoder_sensor]
switch_pin: ^!PA7
detection_length: 7
extruder: extruder
pause_on_runout: true
runout_gcode:
  SET_GCODE_VARIABLE MACRO=_FILAMENT_JAM_STATE VARIABLE=active VALUE=True
  {% if printer.pause_resume.is_paused %}
    RESPOND TYPE=command MSG="Filament motion event latched: printer already paused"
  {% else %}
    M117 FILAMENT JAM - CHECK FILAMENT
    _FILAMENT_JAM_PROMPT
    UPDATE_DELAYED_GCODE ID=_FILAMENT_JAM_PROMPT_REMINDER DURATION=60
    RESPOND TYPE=error MSG="Filament jam / motion error detected"
  {% endif %}


[gcode_macro _FILAMENT_JAM_STATE]
description: Internal latch: blocks automatic resume after filament motion jam
variable_active: False
gcode:
  RESPOND TYPE=command MSG="filament_jam_state"

[gcode_macro TEST_FILAMENT_SENSOR]
gcode:
  {% set s = printer['filament_switch_sensor filament_sensor'].filament_detected %}
  RESPOND TYPE=command MSG="filament_sensor detected = {s}"

[gcode_macro TEST_ENCODER_SENSOR]
gcode:
  RESPOND TYPE=command MSG="encoder_sensor loaded. To test it, extrude filament and block/stop filament movement."

[gcode_macro TEST_FILAMENT_ALL]
gcode:
  TEST_FILAMENT_SENSOR
  TEST_ENCODER_SENSOR

[gcode_macro _FILAMENT_JAM_PROMPT]
description: Show filament jam prompt on Fluidd/GuppyScreen
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin FILAMENT JAM"
  RESPOND TYPE=command MSG="action:prompt_text Filament motion error detected."
  RESPOND TYPE=command MSG="action:prompt_text DO NOT REMOVE PRINT."
  RESPOND TYPE=command MSG="action:prompt_text Check filament, then resume or cancel."
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|warning"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _FILAMENT_JAM_PROMPT_CLEAR]
description: Clear filament jam prompt
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  UPDATE_DELAYED_GCODE ID=_FILAMENT_JAM_PROMPT_REMINDER DURATION=0

[delayed_gcode _FILAMENT_JAM_PROMPT_REMINDER]
gcode:
  {% if printer["gcode_macro _FILAMENT_JAM_STATE"].active %}
    _FILAMENT_JAM_PROMPT
    UPDATE_DELAYED_GCODE ID=_FILAMENT_JAM_PROMPT_REMINDER DURATION=60
  {% endif %}
