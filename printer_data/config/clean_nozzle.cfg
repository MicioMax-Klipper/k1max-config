# Nozzle wipe macros - split from user_override.cfg

[gcode_macro _NOZZLE_WIPE_SILICONE]
description: Wipe nozzle on rear silicone wiper, then return to saved position
gcode:
    SAVE_GCODE_STATE NAME=nozzle_wipe_state

    {% set saved_x = printer.toolhead.position.x|float %}
    {% set saved_y = printer.toolhead.position.y|float %}
    {% set saved_z = printer.toolhead.position.z|float %}
    {% set safe_z = 15.0 if saved_z < 15.0 else saved_z %}

    G90

    ; safe lift before travelling
    G1 Z{safe_z} F3000

    ; single normal wipe
    G1 X115 Y303 F12000
    G1 Z4.10 F600

    G1 X180 Y303 F3000
    G1 X115 Y304 F3000
    G1 X180 Y305 F3000
    G1 X115 Y304 F3000
    G1 X180 Y303 F3000
    G1 X115 Y305 F3000

    ; leave wiper raised and return to saved position
    G1 Z{safe_z} F3000
    G1 X{saved_x} Y{saved_y} F12000
    G1 Z{saved_z} F3000

    RESTORE_GCODE_STATE NAME=nozzle_wipe_state MOVE=0
