# Nozzle wipe macros - split from user_override.cfg

[gcode_macro _NOZZLE_WIPE_SILICONE]
description: Wipe nozzle on rear brush/silicone, including collar cleaning
variable_safe_z: 15.0
variable_wipe_z: 4.10
variable_collar_z: 3.10
variable_x_min: 130.0
variable_x_max: 170.0
variable_y_main: 303.0
variable_y_front: 305.0
variable_y_inner: 300.0
variable_collar_x_max: 140.0
variable_collar_x_step: 2.0
variable_collar_y_min: 280.0
variable_collar_y_max: 305.0
gcode:
    SAVE_GCODE_STATE NAME=nozzle_wipe_state

    {% set m = printer["gcode_macro _NOZZLE_WIPE_SILICONE"] %}
    {% set saved_x = printer.toolhead.position.x|float %}
    {% set saved_y = printer.toolhead.position.y|float %}
    {% set saved_z = printer.toolhead.position.z|float %}
    {% set safe_z = m.safe_z|float if saved_z < m.safe_z|float else saved_z %}

    G90

    ; Move safely above the brush start
    G1 Z{safe_z} F3000
    G1 X{m.x_min} Y{m.y_main} F12000

    ; Main nozzle tip wipe at normal height
    G1 Z{m.wipe_z} F600

    G1 X{m.x_max} Y{m.y_main} F3000
    G1 X{m.x_min} Y{m.y_main} F3000

    G1 Y{m.y_front} F3000
    G1 X{m.x_max} F3000
    G1 X{m.x_min} F3000

    G1 Y{m.y_inner} F3000
    G1 X{m.x_max} F3000
    G1 X{m.x_min} F3000

    ; Collar wipe: lower only while still in the safe X band before Cartographer overlap
    G1 X{m.x_min} Y{m.y_main} F3000
    G1 Z{m.collar_z} F300

    {% set steps = ((m.collar_x_max|float - m.x_min|float) / m.collar_x_step|float)|round(0, "floor")|int %}
    {% for i in range(steps + 1) %}
        {% set x = m.x_min|float + i * m.collar_x_step|float %}
        G1 X{x} Y{m.collar_y_min} F1800
        G1 X{x} Y{m.collar_y_max} F1800
    {% endfor %}

    ; Leave the brush area high and return where we came from
    G1 Z{safe_z} F3000
    G1 X{saved_x} Y{saved_y} F12000
    G1 Z{saved_z} F3000

    RESTORE_GCODE_STATE NAME=nozzle_wipe_state MOVE=0

[gcode_macro _NOZZLE_WIPE_SILICONE_OLD]
description: Wipe nozzle on rear silicone wiper, then return to saved position
gcode:
    SAVE_GCODE_STATE NAME=nozzle_wipe_state

    {% set saved_x = printer.toolhead.position.x|float %}
    {% set saved_y = printer.toolhead.position.y|float %}
    {% set saved_z = printer.toolhead.position.z|float %}
    {% set safe_z = 15.0 if saved_z < 15.0 else saved_z %}

    G90

    ; safe lift before travelling
    G1 Z{safe_z} F3000

    ; single normal wipe
    G1 X115 Y303 F12000
    G1 Z4.10 F600

    G1 X180 Y303 F3000
    G1 X115 Y304 F3000
    G1 X180 Y305 F3000
    G1 X115 Y304 F3000
    G1 X180 Y303 F3000
    G1 X115 Y305 F3000

    ; leave wiper raised and return to saved position
    G1 Z{safe_z} F3000
    G1 X{saved_x} Y{saved_y} F12000
    G1 Z{saved_z} F3000

    RESTORE_GCODE_STATE NAME=nozzle_wipe_state MOVE=0
