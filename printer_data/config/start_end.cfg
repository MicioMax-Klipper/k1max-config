# K1 Max START/END macros

[gcode_macro _START_END_PARAMS]
# this value is multiplied by the target temp to give wait time in seconds
variable_bed_warp_wait_multiplier: 1.5
# how far below target temp can the bed be to do fractional wait times
variable_bed_warp_fraction_wait: 0.75
# how long to wait each loop before displaying a status message
variable_bed_warp_wait_interval: 15
# max velocity for start print and bed mesh calibrate
variable_start_max_velocity: 400
# max accel for start print and bed mesh calibrate
variable_start_max_accel: 10000
# max square corner velocity for bed mesh calibrate
variable_start_square_corner_velocity: 5.0
# what to heat nozzle to just before oozing
variable_start_preheat_nozzle_temp: 148
# whether to do cooldown routine in END_PRINT
variable_end_print_cool_down: True
variable_end_print_cool_down_nozzle_temp: 70.0
# if target bed temp is above this the cool down is skipped
variable_end_print_cool_down_max_bed_temp: 70.0
# if bed warp stabilisation is enabled should we keep the bed heated
variable_end_print_keep_bed_heated: False
# position to move the nozzle to while heating the bed (including heak soaking)
# set this to 0 to disable this behaviour
variable_start_print_bed_heating_move_bed_distance: 20.0
# turn off heaters before tap (eddy-ng) / touch (cartographer) / contact (beacon)
variable_stop_heaters_for_touch: False
# when starting heaters back up after touch, wait for bed first (cartographer only)
variable_after_touch_wait_for_bed: False
# restore heaters if tap (eddy-ng) / touch (cartographer) / contact (beacon) fails
variable_restore_heaters_after_failed_touch: True
# if the print bounding box is more than 75% full then switch to full bed mesh
# set to 0 to disable this to always use adaptive bed meshes
variable_full_bed_mesh_above_percentage_full: 75.0
gcode:

[gcode_macro _CLIENT_VARIABLE]
# the value in mm to lift the nozzle when move to park position
variable_custom_park_dz: 100.0
# park position during CANCEL_PRINT and END_PRINT
variable_park_at_cancel_x: 5
# park position during CANCEL_PRINT and END_PRINT
variable_park_at_cancel_y: 296
# the value to retract during CANCEL_PRINT or END_PRINT
variable_cancel_retract: 7.0
# park position during PAUSE / M600 / FILAMENT RUNOUT
variable_custom_park_x: 296
# park position during PAUSE / M600 / FILAMENT RUNOUT
variable_custom_park_y: 8
# the value to retract during PAUSE / M600 / FILAMENT RUNOUT
variable_retract: 1.0
# retract speed in mm/s
variable_speed_retract: 35.0
# the value to unretract while RESUME
variable_unretract: 1.0
# unretract speed in mm/s
variable_speed_unretract: 35.0
# z move speed in mm/s
variable_speed_hop: 15.0
# move speed in mm/s
variable_speed_move: 100.0
# if this variable is not empty filament must be loaded to start or resume a print
variable_runout_sensor: "filament_switch_sensor filament_sensor"
gcode:

[gcode_macro _KAMP_Settings]
description: This macro contains all adjustable settings for Line Purge and Smart Park
# Z position of nozzle during purge
variable_purge_height: 0.35
# Distance between tip of filament and nozzle before purge, should be at least the same as variable_cancel_retract
variable_tip_distance: 4.0
# Distance the purge will be in front of the print area, default is 10.
variable_purge_margin: 25
# Amount of filament to be purged prior to printing.
variable_purge_amount: 28
# Flow rate of purge in mm3/s. Default is 12.
variable_flow_rate: 8
# Z position for Smart Park, default is 10.
variable_smart_park_height: 10
# Z hop for end of Line Purge before printing, default is 10.
variable_line_purge_z_hop: 10
# how much to retract after doing line purge
variable_line_purge_retract: 0.5
variable_line_purge_retract_speed: 35.0
gcode:

[save_variables]
filename: /usr/data/printer_data/config/saved_variables.cfg

[virtual_pins]

[output_pin Bed_Warp_Stabilisation]
pin: virtual_pin:BED_WARP_STABILISE_pin
value: 0


[delayed_gcode RESTORE_BED_WARP_STABILISATION]
initial_duration: 1.0
gcode:
  {% set saved = printer.save_variables.variables.bed_warp_stabilisation|default(printer['output_pin Bed_Warp_Stabilisation'].value)|float %}
  {% set saved = 1 if saved > 0.5 else 0 %}
  SET_PIN PIN=Bed_Warp_Stabilisation VALUE={saved}
  RESPOND TYPE=command MSG="Restored bed warp stabilisation={saved}"

[idle_timeout]
timeout: 3600
gcode:
  {% if printer.pause_resume.is_paused %}
    RESPOND TYPE=command MSG='Printer is paused, timeout bypassed'
  {% else %}
    RESPOND TYPE=command MSG='Timeout Reached - Turning off heaters and motors'

    TURN_OFF_HEATERS

    {% if 'bed_mesh' in printer.configfile.settings %}
      BED_MESH_CLEAR
    {% endif %}
    M84
  {% endif %}


[gcode_macro _START_PRINT_TOUCH_STATE]
# Do not modify these variables they are used by START_PRINT internally
variable_bed_target: 0.0
variable_extruder_target: 0.0
variable_camera_stopped: False
variable_touch_started: False
gcode:
  {% set BED_TARGET = params.BED_TARGET|default(0)|float %}
  {% set EXTRUDER_TARGET = params.EXTRUDER_TARGET|default(0)|float %}

  SET_GCODE_VARIABLE MACRO=_START_PRINT_TOUCH_STATE VARIABLE=bed_target VALUE={BED_TARGET}
  SET_GCODE_VARIABLE MACRO=_START_PRINT_TOUCH_STATE VARIABLE=extruder_target VALUE={EXTRUDER_TARGET}


[gcode_macro _ON_GCODE_FAILURE]
gcode:
  {% set touch_started = printer["gcode_macro _START_PRINT_TOUCH_STATE"].touch_started %}

  {% if touch_started %}
    SET_GCODE_VARIABLE MACRO=_START_PRINT_TOUCH_STATE VARIABLE=touch_started VALUE=False

    {% if printer["gcode_macro _START_END_PARAMS"].restore_heaters_after_failed_touch %}
      {% set bed_target = printer["gcode_macro _START_PRINT_TOUCH_STATE"].bed_target %}
      {% set extruder_target = printer["gcode_macro _START_PRINT_TOUCH_STATE"].extruder_target %}
      {% if bed_target > 0 or extruder_target > 0 %}
        M140 S{bed_target}
        M104 S{extruder_target}
      {% endif %}
    {% endif %}

    {% set camera_stopped = printer["gcode_macro _START_PRINT_TOUCH_STATE"].camera_stopped %}
    {% if camera_stopped %}
      SET_GCODE_VARIABLE MACRO=_START_PRINT_TOUCH_STATE VARIABLE=camera_stopped VALUE=False
      START_CAMERA
    {% endif %}
  {% else %}
    # restore idle_timeout time if needed
    {% if printer['gcode_macro RESUME'].restore_idle_timeout > 0 %}
      SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro RESUME'].restore_idle_timeout}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
  {% endif %}

  _RESTORE_VELOCITY_ACCEL
  TURN_OFF_FANS

  {% if not touch_started %}
    TURN_OFF_HEATERS
    M84
  {% endif %}

  {% if 'bed_mesh' in printer.configfile.settings %}
    BED_MESH_CLEAR
  {% endif %}

  # clear pause_next_layer and pause_at_layer as preparation for next print
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0

  CANCEL_PRINT_BASE


[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  # if there is an outstanding end print going on, we need to cancel it
  UPDATE_DELAYED_GCODE ID=wait_for_end_print_cooldown DURATION=0

  # restore idle_timeout time if needed
  {% if printer['gcode_macro RESUME'].restore_idle_timeout > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro RESUME'].restore_idle_timeout}
  {% endif %}

  {% if printer["gcode_macro _SAF_ON_CANCEL"] != null %}
    _SAF_ON_CANCEL
  {% endif %}

  {% if not printer.pause_resume.is_paused %}
    _TOOLHEAD_PARK_CANCEL_END_PRINT
  {% endif %}

  {% set cancel_retract = printer['gcode_macro _CLIENT_VARIABLE'].cancel_retract %}
  _CLIENT_RETRACT LENGTH={cancel_retract}
  _RESTORE_VELOCITY_ACCEL
  TURN_OFF_FANS

  TURN_OFF_HEATERS
  M84

  {% if 'bed_mesh' in printer.configfile.settings %}
    BED_MESH_CLEAR
  {% endif %}

  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
  SET_GCODE_VARIABLE MACRO=_FILAMENT_JAM_STATE VARIABLE=active VALUE=False

  # clear pause_next_layer and pause_at_layer as preparation for next print
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0

  CANCEL_PRINT_BASE



[gcode_macro _SAF_ON_PAUSE]
gcode:
  SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0

[gcode_macro _SAF_ON_RESUME]
gcode:
  SET_GCODE_VARIABLE MACRO=_FILAMENT_JAM_STATE VARIABLE=active VALUE=False
  SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1

# this is triggered by filament_switch_sensor
[gcode_macro _ON_FILAMENT_RUNOUT]
gcode:
  {% if printer.print_stats.state == "printing" %}
    PAUSE

    {% if printer["gcode_macro _SAF_ON_FILAMENT_RUNOUT"] != null %}
      _SAF_ON_FILAMENT_RUNOUT
    {% else %}
      RESPOND TYPE=command MSG='Filament Runout detected.'
    {% endif %}
  {% else %}
    RESPOND TYPE=command MSG='Printer already paused.'
  {% endif %}


[gcode_macro START_PRINT]
variable_max_velocity: 0
variable_max_accel: 0
variable_square_corner_velocity: 0
gcode:
  UPDATE_DELAYED_GCODE ID=wait_for_end_print_cooldown DURATION=0

  {% set BED_TEMP=params.BED_TEMP|default(65)|float %}
  {% set EXTRUDER_TEMP=params.EXTRUDER_TEMP|default(230)|float %}
  {% set BED_MESH_ADAPTIVE=params.BED_MESH_ADAPTIVE|default(1) %}
  {% set BED_MESH_PROFILE=params.BED_MESH_PROFILE|default("") %}
  {% set current_bed_temp = printer.heater_bed.temperature %}
  {% set bed_warp_switch = 1 if printer['output_pin Bed_Warp_Stabilisation'].value|float > 0.5 else 0 %}
  SAVE_VARIABLE VARIABLE=bed_warp_stabilisation VALUE={bed_warp_switch}

  {% set runout_sensor = printer["gcode_macro _CLIENT_VARIABLE"].runout_sensor|default("") %}
  {% if runout_sensor != "" and printer[runout_sensor] != null %}
    {% set runout_sensor_id = (runout_sensor.split(" "))[1] %}
    SET_FILAMENT_SENSOR SENSOR={runout_sensor_id} ENABLE=1
    {% if not printer[runout_sensor].filament_detected %}
      RESPOND TYPE=error MSG='Filament not detected, Print aborted!'
      CANCEL_PRINT
    {% endif %}
  {% endif %}

  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=max_velocity VALUE={printer.toolhead.max_velocity}
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=max_accel VALUE={printer.toolhead.max_accel}
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=square_corner_velocity VALUE={printer.toolhead.square_corner_velocity}

  SET_GCODE_VARIABLE MACRO=_FILAMENT_JAM_STATE VARIABLE=active VALUE=False
  SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1

  SET_VELOCITY_LIMIT VELOCITY={printer["gcode_macro _START_END_PARAMS"].start_max_velocity} ACCEL={printer["gcode_macro _START_END_PARAMS"].start_max_accel} SQUARE_CORNER_VELOCITY={printer["gcode_macro _START_END_PARAMS"].start_square_corner_velocity}

  M140 S{BED_TEMP}
  G28

  G90
  G1 Z20 F1200

  ; Start hotend heating while the bed reaches/stabilises.
  M104 S{EXTRUDER_TEMP}

  M190 S{BED_TEMP}

  _WARP_STABILISE TARGET_TEMP={BED_TEMP} CURRENT_TEMP={current_bed_temp}

  ; Final blocking wait before nozzle prep / touch / purge.
  M109 S{EXTRUDER_TEMP}

  _PRTOUCH_PREP_NOZZLE

  BED_MESH_CLEAR
  _START_PRINT_BED_MESH BED_MESH_ADAPTIVE={BED_MESH_ADAPTIVE} BED_MESH_PROFILE="{BED_MESH_PROFILE}"

  G90
  G1 X153 Y153 F12000
  G4 P1000

  PRTOUCH_HOME_Z

  APPLY_PLATE_Z_OFFSET PLATE="{params.PLATE|default('')}" MATERIAL="{params.MATERIAL|default('')}"

  _LINE_PURGE

  SET_VELOCITY_LIMIT VELOCITY={printer.toolhead.max_velocity} ACCEL={printer.toolhead.max_accel} SQUARE_CORNER_VELOCITY={printer.toolhead.square_corner_velocity}

[gcode_macro _START_PRINT_BED_MESH]
gcode:
  {% if 'bed_mesh' in printer.configfile.settings %}
    {% if BED_MESH_PROFILE %}
      BED_MESH_PROFILE LOAD="{BED_MESH_PROFILE}" START_PRINT=1
    {% else %}
      {% set BED_MESH_ADAPTIVE=params.BED_MESH_ADAPTIVE|default(1) %}
      {% set full_bed_mesh_above_percentage_full = printer["gcode_macro _START_END_PARAMS"].full_bed_mesh_above_percentage_full %}
      {% if BED_MESH_ADAPTIVE == 1 and full_bed_mesh_above_percentage_full > 0 %}
        {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
        {% if all_points|length > 0 %}
          {% set print_x_min = all_points | map(attribute=0) | min | float %}
          {% set print_x_max = all_points | map(attribute=0) | max | float %}
          {% set print_y_min = all_points | map(attribute=1) | min | float %}
          {% set print_y_max = all_points | map(attribute=1) | max | float %}

          {% set print_width = print_x_max - print_x_min %}
          {% set print_depth = print_y_max - print_y_min %}
          {% set print_area = print_width * print_depth %}

          # for simplicity sake I am ignoring position_min and just assuming position max is the bed area
          {% set bed_width = printer.configfile.config.stepper_x.position_max | float %}
          {% set bed_depth = printer.configfile.config.stepper_y.position_max | float %}
          {% set bed_area = bed_width * bed_depth %}

          {% set bed_usage = (print_area / bed_area) * 100 %}
          {% if bed_usage >= full_bed_mesh_above_percentage_full %}
            RESPOND TYPE=command MSG="Using full bed mesh (Usage is {bed_usage|round(1)}%)"
            {% set BED_MESH_ADAPTIVE=0 %}
          {% endif %}
        {% endif %}
      {% endif %}
      BED_MESH_CALIBRATE ADAPTIVE={BED_MESH_ADAPTIVE} START_PRINT=1
      {% if printer["gcode_macro _SAF_START_PRINT_AFTER_BED_MESH"] != null %}
        _SAF_START_PRINT_AFTER_BED_MESH {rawparams}
      {% endif %}
    {% endif %}
  {% endif %}


[gcode_macro _TOOLHEAD_PARK_CANCEL_END_PRINT]
gcode:
  {% set cooldown = params.COOLDOWN | default(None) %}
  {% set skip_z_park = params.SKIP_Z_PARK | default(None) %}

  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
    {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
    {% set sp_move = client.speed_move | default(velocity) * 60 %}
    {% set park_at_cancel_x = client.park_at_cancel_x %}

    G90
    {% if not skip_z_park %}
      {% set sp_hop = client.speed_hop | default(15) * 60 %}
      {% set park_dz = client.custom_park_dz | default(2.0) | abs %}
      {% set origin = printer.gcode_move.homing_origin %}
      {% set act = printer.gcode_move.gcode_position %}
      {% set max = printer.toolhead.axis_maximum %}
      {% set z_park = [[(act.z + park_dz), 0]|max, (max.z - origin.z)] | min %}

      G1 Z{z_park} F{sp_hop}
    {% endif %}
    {% if cooldown %}
      {% set park_at_cancel_y = printer.configfile.settings['stepper_y'].position_max / 2 %}
    {% else %}
      {% set park_at_cancel_y = client.park_at_cancel_y %}
    {% endif %}
    G0 X{park_at_cancel_x} Y{park_at_cancel_y} F{sp_move}
    # set back to relative coordinates
    {% if not printer.gcode_move.absolute_coordinates %}
      G91
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG='Printer not homed'
  {% endif %}


[gcode_macro END_PRINT]
variable_started_cooldown: False
gcode:
  {% set bed_warp_stabilisation = printer['output_pin Bed_Warp_Stabilisation'].value|float > 0.5 %}
  {% set end_print_cool_down = printer["gcode_macro _START_END_PARAMS"].end_print_cool_down %}
  {% set end_print_cool_down_nozzle_temp = printer["gcode_macro _START_END_PARAMS"].end_print_cool_down_nozzle_temp|float %}
  {% set end_print_cool_down_max_bed_temp = printer["gcode_macro _START_END_PARAMS"].end_print_cool_down_max_bed_temp|float %}
  {% set end_print_keep_bed_heated = printer["gcode_macro _START_END_PARAMS"].end_print_keep_bed_heated %}
  {% set eddyng = ('probe_eddy_ng btt_eddy' in printer.configfile.settings) %}
  {% set runout_sensor = printer["gcode_macro _CLIENT_VARIABLE"].runout_sensor|default("") %}

  # reset this flag just to make sure
  SET_GCODE_VARIABLE MACRO=END_PRINT VARIABLE=started_cooldown VALUE=False

  _RESTORE_VELOCITY_ACCEL

  {% if 'bed_mesh' in printer.configfile.settings %}
    BED_MESH_CLEAR
  {% endif %}

  {% if eddyng %}
    PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0
  {% endif %}

  {% set current_bed_temp = printer.heater_bed.temperature %}

  {% if printer["gcode_macro _SAF_END_PRINT_START"] != null %}
    _SAF_END_PRINT_START
  {% endif %}

  {% if runout_sensor != "" %}
    {% set runout_sensor_id = (runout_sensor.split(" "))[1] %}
    SET_FILAMENT_SENSOR SENSOR={runout_sensor_id} ENABLE=0
  {% endif %}

  {% set cancel_retract = printer['gcode_macro _CLIENT_VARIABLE'].cancel_retract %}
  _CLIENT_RETRACT LENGTH={cancel_retract}

  # park in front of aux fan if cooldown
  {% if end_print_cool_down and current_bed_temp < end_print_cool_down_max_bed_temp %}
    _TOOLHEAD_PARK_CANCEL_END_PRINT COOLDOWN=1
  {% else %}
    _TOOLHEAD_PARK_CANCEL_END_PRINT
  {% endif %}

  {% if bed_warp_stabilisation and end_print_keep_bed_heated %}
    RESPOND TYPE=command MSG='Heat bed waiting for next print'
    M104 S0  # Turning off the nozzle
  {% else %}
    TURN_OFF_HEATERS
  {% endif %}

  # clear pause_next_layer and pause_at_layer as preparation for next print
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0

  {% if end_print_cool_down and current_bed_temp < end_print_cool_down_max_bed_temp %}
    RESPOND TYPE=command MSG='Waiting for nozzle temp to be below {end_print_cool_down_nozzle_temp}c'

    {% if 'fan_generic auxiliary' in printer.configfile.settings %}
      SET_FAN_SPEED FAN=auxiliary SPEED=0.5
    {% endif %}

    M106 S180

    # flag that we have started the cooldown procedure
    SET_GCODE_VARIABLE MACRO=END_PRINT VARIABLE=started_cooldown VALUE=True
    UPDATE_DELAYED_GCODE ID=wait_for_end_print_cooldown DURATION=1
  {% else %}
    M84
    TURN_OFF_FANS

    {% if printer["gcode_macro _SAF_END_PRINT_END"] != null %}
      _SAF_END_PRINT_END
    {% endif %}
  {% endif %}


[delayed_gcode wait_for_end_print_cooldown]
gcode:
  {% set end_print_cool_down_nozzle_temp = printer["gcode_macro _START_END_PARAMS"].end_print_cool_down_nozzle_temp|float %}
  {% if printer.extruder.temperature <= end_print_cool_down_nozzle_temp %}
    _WAIT_TEMP_COOL_DOWN_END
  {% else %}
    UPDATE_DELAYED_GCODE ID=wait_for_end_print_cooldown DURATION=5
  {% endif %}


# this is defined separately to exit the delayed gcode directly
[gcode_macro _WAIT_TEMP_COOL_DOWN_END]
gcode:
  UPDATE_DELAYED_GCODE ID=wait_for_end_print_cooldown DURATION=0

  # we already lowered the bed earlier so want to skip it now
  _TOOLHEAD_PARK_CANCEL_END_PRINT SKIP_Z_PARK=1

  M84
  TURN_OFF_FANS

  SET_GCODE_VARIABLE MACRO=END_PRINT VARIABLE=started_cooldown VALUE=False

  {% if printer["gcode_macro _SAF_END_PRINT_END"] != null %}
    _SAF_END_PRINT_END
  {% endif %}


# called in CANCEL_PRINT and END_PRINT to restore velocity set in START_PRINT
[gcode_macro _RESTORE_VELOCITY_ACCEL]
gcode:
  {% set max_velocity = printer.toolhead.max_velocity %}
  {% set max_accel = printer.toolhead.max_accel %}
  {% set square_corner_velocity = printer.toolhead.square_corner_velocity %}
  {% set start_max_velocity = printer["gcode_macro START_PRINT"].max_velocity %}
  {% set start_max_accel = printer["gcode_macro START_PRINT"].max_accel %}
  {% set start_square_corner_velocity = printer["gcode_macro START_PRINT"].square_corner_velocity %}
  {% if start_max_velocity > 0 and start_max_accel > 0 and start_square_corner_velocity > 0 and (max_velocity != start_max_velocity or max_accel != start_max_accel or square_corner_velocity != start_square_corner_velocity) %}
    RESPOND TYPE=command MSG='Restoring VELOCITY={start_max_velocity} (was {max_velocity}) ACCEL={start_max_accel} (was {max_accel}) SQUARE_CORNER_VELOCITY={start_square_corner_velocity} (was {square_corner_velocity})'
    SET_VELOCITY_LIMIT VELOCITY={start_max_velocity} ACCEL={start_max_accel} SQUARE_CORNER_VELOCITY={start_square_corner_velocity}
  {% endif %}


# Thanks to Zero for this macro
[gcode_macro _WARP_STABILISE]
description: "Performs bed warp stabilisation based on the current bed temperature. Adjusts stabilisation time according to the bed temperature."
gcode:
  {% set warp_switch = printer['output_pin Bed_Warp_Stabilisation'].value|float %}
  {% set bed_warp_stabilisation = warp_switch > 0.5 %}
  {% if bed_warp_stabilisation %}
   {% set current_temp = params.CURRENT_TEMP|default(printer.heater_bed.temperature)|float %}
   {% set target_temp = params.TARGET_TEMP|float %}
   {% if current_temp < (target_temp * 0.99) %}
     {% set multiplier = printer["gcode_macro _START_END_PARAMS"].bed_warp_wait_multiplier|float %}
     {% set interval = printer["gcode_macro _START_END_PARAMS"].bed_warp_wait_interval|int %}
     {% set partial = printer["gcode_macro _START_END_PARAMS"].bed_warp_fraction_wait|float %}
     # if current temp is already pretty high, we only need to do a fraction of heat soaking
     {% if current_temp > (target_temp * partial) %}
       {% set total_time = ((target_temp - current_temp) * multiplier)|int %}
     {% else %}
       # 100c will be 13 minutes approx heat time, 65c will be 8.5 minutes preheat, etc.
       {% set total_time = (target_temp * multiplier)|int %}
     {% endif %}

     RESPOND TYPE=command MSG='Bed Warp Stabilisation starting with a total time of {total_time} seconds...'

     {% set loops = (total_time / interval)|int %}
     {% for i in range(loops) %}
       {% set time_remaining = total_time - (i + 1) * interval %}
       RESPOND TYPE=command MSG='Bed Warp Stabilization { time_remaining } seconds remaining'
       {% if time_remaining < interval %}
         G4 P{ time_remaining * 1000 }  # Wait for the interval time in milliseconds
       {% else %}
         G4 P{ interval * 1000 }  # Wait for the interval time in milliseconds
       {% endif %}
     {% endfor %}

     RESPOND TYPE=command MSG='Warp Stabilisation complete!'
    {% else %}
      RESPOND TYPE=command MSG='Skipping bed warp stabilisation as bed already at {current_temp}c'
    {% endif %}
  {% else %}
    RESPOND TYPE=command MSG='Skipping bed warp stabilisation - it is disabled'
  {% endif %}
