[gcode_macro PROBE_MANAGER]
variable_home_probe: "prtouch"
variable_ztouch_probe: "prtouch"
variable_mesh_probe: "cartographer"
gcode:
    RESPOND MSG="home={printer['gcode_macro PROBE_MANAGER'].home_probe} ztouch={printer['gcode_macro PROBE_MANAGER'].ztouch_probe} mesh={printer['gcode_macro PROBE_MANAGER'].mesh_probe}"
