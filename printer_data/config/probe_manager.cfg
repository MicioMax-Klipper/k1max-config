# Probe selector state.
#
# Runtime values live in this macro.
# Persistent values are stored through SAVE_VARIABLE and reloaded by
# _PROBE_MANAGER_LOAD_SAVED after Klipper restarts.

[gcode_macro PROBE_MANAGER]
description: Show current probe selector state
variable_home_probe: "cartographer"
variable_ztouch_probe: "prtouch"
variable_mesh_probe: "cartographer"
variable_prtouch_mesh_probe_count: "6,6"
gcode:
  PROBE_STATUS

[delayed_gcode _PROBE_MANAGER_LOAD_SAVED]
initial_duration: 1.0
gcode:
  _PROBE_MANAGER_APPLY_SAVED

[gcode_macro _PROBE_MANAGER_APPLY_SAVED]
description: Internal: load persisted probe selector values
gcode:
  {% set saved = printer.save_variables.variables %}
  {% set current = printer["gcode_macro PROBE_MANAGER"] %}
  {% set home_probe = saved.get("probe_home_probe", current.home_probe)|lower %}
  {% set ztouch_probe = saved.get("probe_ztouch_probe", current.ztouch_probe)|lower %}
  {% set mesh_probe = saved.get("probe_mesh_probe", current.mesh_probe)|lower %}
  {% set prtouch_count = saved.get("prtouch_mesh_probe_count", current.prtouch_mesh_probe_count) %}

  SET_GCODE_VARIABLE MACRO=PROBE_MANAGER VARIABLE=home_probe VALUE="'{home_probe}'"
  SET_GCODE_VARIABLE MACRO=PROBE_MANAGER VARIABLE=ztouch_probe VALUE="'{ztouch_probe}'"
  SET_GCODE_VARIABLE MACRO=PROBE_MANAGER VARIABLE=mesh_probe VALUE="'{mesh_probe}'"
  SET_GCODE_VARIABLE MACRO=PROBE_MANAGER VARIABLE=prtouch_mesh_probe_count VALUE="'{prtouch_count}'"

  RESPOND MSG="PROBE_MANAGER loaded: home={home_probe} ztouch={ztouch_probe} mesh={mesh_probe} prtouch_count={prtouch_count}"

[gcode_macro PROBE_STATUS]
description: Show active and saved probe selector values
gcode:
  {% set current = printer["gcode_macro PROBE_MANAGER"] %}
  {% set saved = printer.save_variables.variables %}
  RESPOND MSG="PROBE active: home={current.home_probe} ztouch={current.ztouch_probe} mesh={current.mesh_probe} prtouch_count={current.prtouch_mesh_probe_count}"
  RESPOND MSG="PROBE saved: home={saved.get('probe_home_probe', '-')} ztouch={saved.get('probe_ztouch_probe', '-')} mesh={saved.get('probe_mesh_probe', '-')} prtouch_count={saved.get('prtouch_mesh_probe_count', '-')}"

[gcode_macro PROBE_SELECT]
description: Persistently select probes. Params: HOME=prtouch|cartographer ZTOUCH=prtouch|cartographer MESH=prtouch|cartographer COUNT=6,6
gcode:
  {% set current = printer["gcode_macro PROBE_MANAGER"] %}
  {% set home_probe = params.HOME|default(current.home_probe)|lower %}
  {% set ztouch_probe = params.ZTOUCH|default(current.ztouch_probe)|lower %}
  {% set mesh_probe = params.MESH|default(current.mesh_probe)|lower %}
  {% set prtouch_count = params.COUNT|default(current.prtouch_mesh_probe_count) %}
  {% set valid = ["prtouch", "cartographer"] %}

  {% if home_probe not in valid %}
    { action_raise_error("PROBE_SELECT: invalid HOME='%s'" % home_probe) }
  {% endif %}
  {% if ztouch_probe not in valid %}
    { action_raise_error("PROBE_SELECT: invalid ZTOUCH='%s'" % ztouch_probe) }
  {% endif %}
  {% if mesh_probe not in valid %}
    { action_raise_error("PROBE_SELECT: invalid MESH='%s'" % mesh_probe) }
  {% endif %}

  SET_GCODE_VARIABLE MACRO=PROBE_MANAGER VARIABLE=home_probe VALUE="'{home_probe}'"
  SET_GCODE_VARIABLE MACRO=PROBE_MANAGER VARIABLE=ztouch_probe VALUE="'{ztouch_probe}'"
  SET_GCODE_VARIABLE MACRO=PROBE_MANAGER VARIABLE=mesh_probe VALUE="'{mesh_probe}'"
  SET_GCODE_VARIABLE MACRO=PROBE_MANAGER VARIABLE=prtouch_mesh_probe_count VALUE="'{prtouch_count}'"

  SAVE_VARIABLE VARIABLE=probe_home_probe VALUE="'{home_probe}'"
  SAVE_VARIABLE VARIABLE=probe_ztouch_probe VALUE="'{ztouch_probe}'"
  SAVE_VARIABLE VARIABLE=probe_mesh_probe VALUE="'{mesh_probe}'"
  SAVE_VARIABLE VARIABLE=prtouch_mesh_probe_count VALUE="'{prtouch_count}'"

  RESPOND MSG="PROBE selected: home={home_probe} ztouch={ztouch_probe} mesh={mesh_probe} prtouch_count={prtouch_count}"

[gcode_macro PROBE_ALL_PRTOUCH]
description: Select PRTouch for home, Z touch, and mesh
gcode:
  PROBE_SELECT HOME=prtouch ZTOUCH=prtouch MESH=prtouch


[gcode_macro PROBE_ALL_CARTOGRAPHER]
description: Select Cartographer for home, Z touch, and mesh
gcode:
  PROBE_SELECT HOME=cartographer ZTOUCH=cartographer MESH=cartographer

[gcode_macro PROBE_ZTOUCH_PRTOUCH]
description: Select PRTouch for final Z touch
gcode:
  PROBE_SELECT ZTOUCH=prtouch

[gcode_macro PROBE_MESH_PRTOUCH]
description: Select PRTouch for bed mesh
gcode:
  PROBE_SELECT MESH=prtouch

[gcode_macro PROBE_MESH_CARTOGRAPHER]
description: Select Cartographer for bed mesh
gcode:
  PROBE_SELECT MESH=cartographer

[gcode_macro PROBE_HOME_PRTOUCH]
description: Select PRTouch for Z homing
gcode:
  PROBE_SELECT HOME=prtouch

[gcode_macro PROBE_HOME_CARTOGRAPHER]
description: Select Cartographer for Z homing
gcode:
  PROBE_SELECT HOME=cartographer

[gcode_macro PROBE_ZTOUCH_CARTOGRAPHER]
description: Select Cartographer for final Z touch
gcode:
  PROBE_SELECT ZTOUCH=cartographer

[gcode_macro PROBE_MESH_5X5]
description: Set default PRTouch mesh size to 5x5
gcode:
  PROBE_SELECT COUNT=5,5

[gcode_macro PROBE_MESH_6X6]
description: Set default PRTouch mesh size to 6x6
gcode:
  PROBE_SELECT COUNT=6,6

[gcode_macro PRTOUCH_SCREWS_CALCULATE]
description: Safely measure configured [screws_tilt_adjust] points using PRTouch
gcode:
  {% set st = printer.configfile.settings['screws_tilt_adjust'] %}

  {% set s1 = st.screw1 %}
  {% set s2 = st.screw2 %}
  {% set s3 = st.screw3 %}

  {% set n1 = st.screw1_name|default("screw1")|replace(" ", "_") %}
  {% set n2 = st.screw2_name|default("screw2")|replace(" ", "_") %}
  {% set n3 = st.screw3_name|default("screw3")|replace(" ", "_") %}

  PROBE_ALL_PRTOUCH
  SET_GCODE_OFFSET Z=0 MOVE=0
  BED_MESH_CLEAR
  MAX_HOMING_RESET

  G28

  PRTOUCH_SCREWS_CALCULATE_RAW S1={s1[0]},{s1[1]} N1={n1} S2={s2[0]},{s2[1]} N2={n2} S3={s3[0]},{s3[1]} N3={n3}
